{% extends "base.html" %}

{% block content %}
<h1>知り合い情報を編集</h1>
<form method="POST">
    <label for="name">名前:</label>
    <input type="text" id="name" name="name" value="{{ friend.name }}" required>
    <label for="contact">連絡先:</label>
    <input type="text" id="contact" name="contact" value="{{ friend.contact }}">
    <label for="date_met">知り合った日:</label>
    <input type="date" id="date_met" name="date_met" value="{{ friend.date_met }}">
    <label for="note">メモ:</label>
    <textarea id="note" name="note">{{ friend.note }}</textarea>
    <button type="submit">更新</button>
</form>
{% endblock %}
