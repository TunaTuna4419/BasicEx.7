{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
    <h1>Welcome, {{ user.username }}</h1>
    <form method="post" action="{{ url_for('create_friend') }}">
        <h2>Add Friend</h2>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <label for="contact">Contact:</label>
        <input type="text" id="contact" name="contact">
        <label for="other">Other:</label>
        <textarea id="other" name="other"></textarea>
        <button type="submit">Add Friend</button>
    </form>
    <h2>Your Friends</h2>
    {% for friend in user.friends %}
        <div>
            <p>Name: {{ friend.name }}</p>
            <p>Contact: {{ friend.contact }}</p>
            <p>Other: {{ friend.other }}</p>
            <form method="post" action="{{ url_for('update_friend', friend_id=friend.id) }}">
                <button type="submit">Update</button>
            </form>
            <form method="post" action="{{ url_for('delete_friend', friend_id=friend.id) }}">
                <button type="submit">Delete</button>
            </form>
        </div>
    {% endfor %}
{% endblock %}
