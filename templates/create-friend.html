{% extends "base.html" %}

{% block title %}知り合い登録{% endblock %}

{% block head %}
<style>
.box {
    border: #4e7bcc 1px solid; /*境界線の指定*/
    padding:10px;
}
.box p {
    margin:0;
    padding:0;
}
table {
    width: 60%;
    border-collapse: collapse;
    border: 1px solid #000;
    background-color: #f9f9f9;
    color: #333;
    display: inline-block;
    vertical-align: top;
}
th, td {
    border: 1px solid #000;
    text-align: center;
    padding: 8px;
}
thead {
    background-color: #4CAF50;
    color: #FFFFFF;
}
tbody tr:nth-child(even) {
    background-color: #f2f2f2;
}
.note-box {
    display: inline-block;
    vertical-align: top;
    margin-left: 20px;
}
.note-box input[type="text"] {
    width: 300px;
    height: 300px;
    box-sizing: border-box;
    padding: 10px;
    border: 1px solid #000;
}
</style>
{% endblock %}

{% block header %}
<h1>知り合い整理アプリ</h1>
<h2>知り合い登録</h2>
{% endblock %}

{% block content %}
ユーザ名：
<div class="box">
    <p>受け取ったユーザ名</p>
</div>
<form action="#" method="post">
    <p>知り合い名：<br>
    <input type="text" name="friend-name"></p>
    <input type="date">
    <p>連絡先メモ（直接メールアドレスや電話番号を書くことは危険です。）：<br>
    <input type="text" name="contact-address"></p>  
    <button type="submit" name="create-friend" value="value">知り合い登録</button>
</form>

<h2>時間割</h2>

    <table>

        </thead>
        <tbody>

                <td><input type="text" name="data3" style="width: 100%; box-sizing: border-box;"></td>
