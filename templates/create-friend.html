{% extends "base.html" %}

{% block title %}知り合い登録{% endblock %}

{% block head %}
<style>
.box {
    border: #4e7bcc 1px solid; /*境界線の指定*/
    padding:10px;
}
.box p {
margin:0;
padding:0;
}
table {
            width: 40%;
            border-collapse: collapse;
            border: 1px solid #000;
            background-color: #f9f9f9;
            color: #333;
        }
        th, td {
            border: 1px solid #000;
            text-align: center;
            padding: 8px;
        }
        thead {
            background-color: #4CAF50;
            color: #FFFFFF;
        }
        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }
</style>
{% endblock %}

{% block header %}
<h1>知り合い整理アプリ</h1>
<h2>知り合い登録</h2>
{% endblock %}
