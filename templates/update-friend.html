{% extends "base.html" %}
{% block title %}Update Friend{% endblock %}
{% block content %}
    <h1>Update Friend</h1>
    <form method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ friend.name }}" required>
        <label for="contact">Contact:</label>
        <input type="text" id="contact" name="contact" value="{{ friend.contact }}">
        <label for="other">Other:</label>
        <textarea id="other" name="other">{{ friend.other }}</textarea>
        <button type="submit">Update</button>
    </form>
{% endblock %}
