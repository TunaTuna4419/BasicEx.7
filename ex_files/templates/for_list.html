{% extends "base.html" %}
{% block title %}一覧ページ{% endblock %}

{% block header %}<h1>一覧：画面</h1>{% endblock %}

{% block content %}


<table border="1">
    <thead>
        <tr><th>ID</th><th>人物名</th></tr>
    </thead>

    <tbody>
        {% for item in items %}
        <tr>
            <td><a href="{{ url_for('show_detail', id=item.id)}}">{{item.id}}</a></td>
            <td><a href="{{ url_for('show_detail', id=item.id)}}">{{item.name}}</a></td>
        </tr>
        {% endfor %}
    </tbody>
    
</table>

{% endblock %}
